<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171319" />
    <title>BarLingo</title>
    <style>
      /* Boot loader: visible from the first byte until the app has connected (removed by App.vue). */
      html, body { margin: 0; background: #171319; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 18px; color: #f8efe7; font: 600 14px/1.3 Inter, system-ui, sans-serif; letter-spacing: .04em;
        background: linear-gradient(#171319d9, #171319f2), url('/assets/ui/surface-dialog.webp') center / cover #171319; transition: opacity .35s ease; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .ring { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #e4b35c33; border-top-color: #e4b35c; animation: boot-spin .9s linear infinite; }
      #boot b { font-size: 22px; letter-spacing: .12em; color: #e4b35c; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation-duration: 3s; } }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite"><b>BARLINGO</b><div class="ring"></div><span>Opening the bar…</span></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
