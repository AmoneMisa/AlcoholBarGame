# Production stack on the server: Postgres + the game (image from GitHub Container Registry) + Caddy (HTTPS).
# Lives in the deploy directory on the server (default /opt/barlingo) next to Caddyfile and .env.
# CI passes this file an explicit server-side .env and updates only `app` with --no-deps.
name: barlingo

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barlingo}
      POSTGRES_USER: ${POSTGRES_USER:-barlingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]

  app:
    # CI sets APP_IMAGE to the exact commit it just built (…:master-<sha>), so every deploy is traceable
    # and a rollback is just re-running an older workflow.
    image: ${APP_IMAGE:?Set APP_IMAGE in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-barlingo}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-barlingo}
    depends_on:
      database:
        condition: service_healthy
    # The host's nginx (HTTPS for the domain) proxies to 127.0.0.1:3000, so the app publishes that port on the loopback only.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]

  caddy:
    # Only for a server that has no web server of its own (ports 80 and 443 free): start it with `--profile caddy`.
    # On this server nginx owns 80 and 443, so Caddy stays off.
    profiles: ["caddy"]
    # Gets and renews a Let's Encrypt certificate for DOMAIN automatically (ports 80 and 443 must be open).
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [backend]

volumes:
  postgres_data:
    name: barlingo_postgres_data
  caddy_data:
  caddy_config:

networks:
  backend:
