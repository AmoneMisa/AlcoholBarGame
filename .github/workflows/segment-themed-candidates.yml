name: Candidate segmentation for themed scenes

on:
  push:
    branches:
      - feat/modular-velvet-scene
    paths:
      - scripts/segment-themed-candidates.py
      - .github/workflows/segment-themed-candidates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  segment:
    if: ${{ !contains(github.event.head_commit.message || '', '[candidate-segment]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/modular-velvet-scene
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow "rembg[cpu]"
      - run: python scripts/segment-themed-candidates.py
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rs=list(Path('public/assets/bar/modular').glob('*/auto-candidate/segmentation-report.json'))
          counts={}
          for p in rs:
              data=json.loads(p.read_text())
              for item in data['roles'].values():
                  s=item.get('status','unknown'); counts[s]=counts.get(s,0)+1
          print('candidate reports',len(rs),counts)
          assert len(rs)>=50, len(rs)
          PY
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/bar/modular/*/auto-candidate
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[candidate-segment] Segment themed modular references"
            git push origin HEAD:feat/modular-velvet-scene
          fi
