name: Build and publish Docker image

on:
  push:
    branches:
      - master

concurrency:
  group: docker-master
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test application
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=master-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # Deploys the image just built to the server over SSH, then checks that the game answers.
  # Reads from the "production" environment (or the repository): DEPLOY_SSH_KEY must be a secret; DEPLOY_HOST,
  # DEPLOY_USER and the optional DEPLOY_PORT (default 22) / DEPLOY_PATH (default /opt/barlingo) may be secrets
  # or variables. Skipped while DEPLOY_HOST is not set.
  deploy:
    needs: test-build-publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '~/opt/alcoholbot' }}
    steps:
      - name: Check deploy configuration
        id: config
        run: echo "enabled=${{ env.DEPLOY_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check out deploy files
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: deploy

      - name: Deploy over SSH
        if: steps.config.outputs.enabled == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}:master-${GITHUB_SHA::7}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST"
          $SSH "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" deploy/compose.prod.yaml deploy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          echo "$REGISTRY_TOKEN" | $SSH "docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin"
          $SSH "cd '$DEPLOY_PATH' && test -r .env || { echo 'Deployment error: $DEPLOY_PATH/.env is missing or unreadable.' >&2; exit 1; }"
          $SSH "cd '$DEPLOY_PATH' && APP_IMAGE='$IMAGE' docker compose --env-file .env -f compose.prod.yaml pull app"
          # Only the application image changed. Do not recreate or restart Postgres and Caddy.
          $SSH "cd '$DEPLOY_PATH' && APP_IMAGE='$IMAGE' docker compose --env-file .env -f compose.prod.yaml up -d --no-deps app"
          # Persist the image only after the new container has started successfully.
          $SSH "cd '$DEPLOY_PATH' && if grep -q '^APP_IMAGE=' .env; then sed -i 's#^APP_IMAGE=.*#APP_IMAGE=$IMAGE#' .env; else printf '\\nAPP_IMAGE=%s\\n' '$IMAGE' >> .env; fi && docker image prune -f"
          echo "Deployed $IMAGE"

      - name: Health check
        if: steps.config.outputs.enabled == 'true'
        run: |
          for attempt in $(seq 1 20); do
            if ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose --env-file .env -f compose.prod.yaml exec -T app node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""; then
              echo "Game is healthy."; exit 0
            fi
            sleep 6
          done
          echo "The game did not become healthy." >&2; exit 1
