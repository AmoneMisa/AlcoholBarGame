name: Build modular architecture auto review

on:
  workflow_dispatch:
  push:
    branches:
      - feat/modular-velvet-scene
    paths:
      - scripts/build-architecture-auto.py
      - .github/workflows/build-architecture-auto.yml

permissions:
  contents: write

concurrency:
  group: modular-architecture-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-auto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/modular-velvet-scene
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - run: python scripts/build-architecture-masks.py
      - run: python scripts/build-window-masks.py
      - run: python scripts/build-architecture-auto.py
      - name: Validate auto review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('docs/modular-review/architecture-auto.json').read_text())
          assert report['count']==73, report['count']
          missing=[item['scene'] for item in report['scenes'] if not Path(item['output']).exists()]
          assert not missing, missing
          print('architecture-auto',report['count'])
          PY
      - name: Publish review-only auto architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modular-review/architecture-auto.json docs/modular-review/architecture-auto.jpg public/assets/bar/modular/*/architecture-auto.webp
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[architecture-auto] Build review-only inpaint"
          for attempt in 1 2 3; do
            git fetch origin feat/modular-velvet-scene
            if git rebase origin/feat/modular-velvet-scene && git push origin HEAD:feat/modular-velvet-scene; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
