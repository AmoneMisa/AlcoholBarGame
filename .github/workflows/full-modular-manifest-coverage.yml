name: Full modular manifest coverage

on:
  push:
    branches:
      - feat/modular-velvet-scene

concurrency:
  group: modular-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bar:scene-plan-all
      - run: pnpm bar:readiness
