name: Build modular review sheets

on:
  workflow_dispatch:
  push:
    branches:
      - feat/modular-velvet-scene
    paths:
      - scripts/build-modular-review.py
      - scripts/build-architecture-queue.mjs
      - scripts/build-architecture-masks.py
      - scripts/build-furniture-cleanup-queue.mjs
      - scripts/build-window-masks.py
      - .github/workflows/build-modular-review.yml

permissions:
  contents: write

concurrency:
  group: modular-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !contains(github.event.head_commit.message || '', '[modular-review]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/modular-velvet-scene
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/build-modular-review.py
      - run: python scripts/build-architecture-masks.py
      - run: node scripts/build-architecture-queue.mjs
      - run: node scripts/build-furniture-cleanup-queue.mjs
      - run: python scripts/build-window-masks.py
      - name: Validate coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('docs/modular-review/summary.json').read_text())
          assert len(s)==74, len(s)
          measured=[x for x in s if x['kind']=='measured']
          candidate=[x for x in s if x['kind']=='candidate']
          assert len(measured)==20, len(measured)
          assert len(candidate)==54, len(candidate)
          readiness=json.loads(Path('docs/modular-review/readiness.json').read_text())
          masks=json.loads(Path('docs/modular-review/architecture-masks.json').read_text())
          queue=json.loads(Path('docs/modular-review/architecture-queue.json').read_text())
          cleanup=json.loads(Path('docs/modular-review/furniture-cleanup-queue.json').read_text())
          assert len(readiness['furnitureReady'])==8, readiness['furnitureReady']
          assert len(readiness['cleanFurnitureReady'])==1, readiness['cleanFurnitureReady']
          assert len(readiness['productionReady'])==1, readiness['productionReady']
          assert len(readiness['blockedArchitecture'])==7, readiness['blockedArchitecture']
          assert masks['count']==7, masks['count']
          assert queue['count']==7, queue['count']
          assert cleanup['count']==21, cleanup['count']
          assert len(cleanup['scenes'])==7, cleanup['scenes']
          assert {x['scene'] for x in masks['scenes']}=={x['id'] for x in queue['scenes']}==set(cleanup['scenes'])
          print('measured',len(measured),'candidate',len(candidate),'promoted',sum(len(x['promoted']) for x in s),'architecture-masks',masks['count'],'cleanup-items',cleanup['count'])
          PY
      - name: Commit review outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modular-review public/assets/bar/modular/*/review-ready public/assets/bar/modular/*/architecture-mask.png public/assets/bar/modular/*/window-mask.png
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[modular-review] Build scene review sheets"
            git push origin HEAD:feat/modular-velvet-scene
          fi
