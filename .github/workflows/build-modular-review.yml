name: Build modular review sheets

on:
  workflow_dispatch:
  push:
    branches:
      - feat/modular-velvet-scene
    paths:
      - scripts/build-modular-review.py
      - scripts/build-architecture-queue.mjs
      - scripts/build-architecture-masks.py
      - scripts/build-architecture-prep.py
      - scripts/build-composite-ready.py
      - scripts/build-generated-modular-scenes.mjs
      - scripts/build-furniture-cleanup-queue.mjs
      - scripts/build-window-masks.py
      - scripts/build-manual-role-cuts.py
      - scripts/audit-seat-assets.py
      - scripts/modular-scenes/**
      - public/assets/bar/modular/**/scene-plan.json
      - .github/workflows/build-modular-review.yml

permissions:
  contents: write

concurrency:
  group: modular-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !contains(github.event.head_commit.message || '', '[modular-review]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/modular-velvet-scene
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/build-manual-role-cuts.py
      - run: python scripts/audit-seat-assets.py
      - run: python scripts/build-modular-review.py
      - run: python scripts/build-architecture-masks.py
      - run: python scripts/build-architecture-prep.py
      - run: node scripts/build-architecture-queue.mjs
      - run: node scripts/build-furniture-cleanup-queue.mjs
      - run: python scripts/build-window-masks.py
      - run: python scripts/build-composite-ready.py
      - run: node scripts/build-generated-modular-scenes.mjs
      - name: Validate coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('docs/modular-review/summary.json').read_text())
          assert len(s)==74, len(s)
          measured=[x for x in s if x['kind']=='measured']
          candidate=[x for x in s if x['kind']=='candidate']
          assert len(measured)==74, (len(measured),len(candidate))
          assert len(candidate)==0, [x['scene'] for x in candidate]
          readiness=json.loads(Path('docs/modular-review/readiness.json').read_text())
          masks=json.loads(Path('docs/modular-review/architecture-masks.json').read_text())
          queue=json.loads(Path('docs/modular-review/architecture-queue.json').read_text())
          cleanup=json.loads(Path('docs/modular-review/furniture-cleanup-queue.json').read_text())
          windows=json.loads(Path('docs/modular-review/window-masks.json').read_text())
          prep=json.loads(Path('docs/modular-review/architecture-prep.json').read_text())
          composite=json.loads(Path('docs/modular-review/composite-ready.json').read_text())
          assert readiness['productionReady']==['velvet'], readiness['productionReady']
          blocked_arch=set(readiness['blockedArchitecture'])
          blocked_cleanup=set(readiness['blockedFurnitureCleanup'])
          mask_scenes={x['scene'] for x in masks['scenes']}
          queue_scenes={x['id'] for x in queue['scenes']}
          cleanup_scenes=set(cleanup['scenes'])
          window_scenes={x['scene'] for x in windows['scenes']}
          expected_window_scenes={x['id'] for x in queue['scenes'] if x.get('windowCutouts')}
          expected_cleanup_items=sum(len(x.get('requiredRoles', ['counter','shelf','seating'])) for x in s if x['scene'] in blocked_cleanup)
          expected_prep={x['scene'] for x in s if not x['productionReady']}
          assert mask_scenes==blocked_arch, (mask_scenes,blocked_arch)
          assert queue_scenes==blocked_arch, (queue_scenes,blocked_arch)
          assert cleanup_scenes==blocked_cleanup, (cleanup_scenes,blocked_cleanup)
          assert cleanup['count']==expected_cleanup_items, (cleanup['count'],expected_cleanup_items)
          assert window_scenes==expected_window_scenes, (window_scenes,expected_window_scenes)
          assert prep['count']==len(expected_prep), (prep['count'],len(expected_prep))
          assert {x['scene'] for x in prep['scenes']}==expected_prep
          assert composite['count']==74, composite['count']
          assert composite['complete']==74, composite['complete']
          assert all(item['complete'] for item in composite['scenes'])
          print('measured',len(measured),'candidate',len(candidate),'promoted',sum(len(x['promoted']) for x in s),'architecture-masks',masks['count'],'cleanup-items',cleanup['count'],'window-masks',windows['count'],'composite-ready',composite['complete'])
          PY
      - name: Commit review outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modular-review public/assets/bar/modular/*/review-ready public/assets/bar/modular/*/architecture-mask.png public/assets/bar/modular/*/window-mask.png public/assets/bar/modular/*/architecture-prep.webp public/assets/bar/modular/*/manual public/assets/bar/modular/*/composite-ready src/data/cosmetics/generatedModularScenes.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[modular-review] Build scene review sheets"
            for attempt in 1 2 3; do
              git fetch origin feat/modular-velvet-scene
              if git rebase origin/feat/modular-velvet-scene; then
                if git push origin HEAD:feat/modular-velvet-scene; then
                  exit 0
                fi
              else
                git rebase --abort || true
              fi
              echo "Publish attempt $attempt failed; retrying..."
              sleep $((attempt * 2))
            done
            echo "Could not publish modular review outputs after 3 attempts"
            exit 1
          fi
