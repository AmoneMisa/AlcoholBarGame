#bar-customizer-design .eyebrow{font-size:11px;letter-spacing:.13em;color:var(--editor-muted)}

#bar-customizer-design .room-title{color:var(--editor-muted);font-size:12px;max-width:150px}
#bar-customizer-design h3{margin:0;font-size:15px;font-weight:500}
#bar-customizer-design button{background:var(--editor-panel);border:1px solid var(--editor-line);border-radius:6px;color:inherit;padding:4px 8px;font:inherit;min-height:28px}

#bar-customizer-design .part-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
#bar-customizer-design .part-tabs button{font-size:12px;display:flex;align-items:center;gap:6px}

#bar-customizer-design .save-status{font-size:12px;color:var(--editor-muted)}
#bar-customizer-design .apply-button{background:var(--editor-gold);border-color:var(--editor-gold);color:var(--editor-bg)}
#bar-customizer-design button:disabled{opacity:.45}
#bar-customizer-design .compact{max-width:700px}
#bar-customizer-design .compact .editor-layout{grid-template-columns:1fr}

@media(max-width:700px){#bar-customizer-design .editor-layout{grid-template-columns:1fr}#bar-customizer-design .catalog{grid-template-columns:repeat(4,minmax(0,1fr))}#bar-customizer-design .scale-control{grid-column:1/-1}#bar-customizer-design .scale-control .reset-position{width:auto}#bar-customizer-design .preview-hint{font-size:11px}}

<script>
(()=>{
const root=document.getElementById('bar-customizer-design');
const data=JSON.parse(document.getElementById('bar-customizer-assets').textContent);

function img(source){if(!cache.has(source)){const image=new Image();const promise=new Promise(resolve=>{image.onload=()=>resolve(image);image.onerror=()=>resolve(null);});image.src=source;cache.set(source,promise);}return cache.get(source);}
function initial(){return {room:'izakaya',shelves:'izakaya',counter:'izakaya',seating:'izakaya',outside:'beach',bottles:'velvet-original',lighting:'amber',seatCount:4,strength:35,poses:{outside:{x:0,y:0,z:115},shelves:{x:0,y:0,z:100},counter:{x:0,y:0,z:100},seating:{x:0,y:0,z:100}}};}

 if(!data.bottlePresets.some(preset=>preset.id===state.bottles))state.bottles='velvet-original';
 normalizeScales();applied=clone(state);

       const compile=(type,code)=>{const shader=gl.createShader(type);gl.shaderSource(shader,code);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(shader));return shader;};

 const room=()=>data.rooms.find(item=>item.id===state.room)??data.rooms[0];
 const poseKey=()=>active;
 const pose=()=>state.poses[poseKey()]??{x:0,y:0,z:100};
 const partLabel=()=>categories.find(item=>item[0]===active)?.[1]??'Bar view';
 for(const [id,label,icon] of categories){const button=document.createElement('button');button.className='cursor-interaction';button.type='button';button.dataset.category=id;button.innerHTML='<i data-lucide="'+icon+'" aria-hidden="true"></i><span>'+label+'</span>';button.onclick=()=>{active=id;renderCatalog();syncControls();remember();};q('.part-tabs').append(button);}
 function remember(){window.openai?.setWidgetState?.({modelContent:{design:section.dataset.variant,part:active,scenery:state.outside,scale:pose().z,position:pose()},privateContent:{...(window.openai?.widgetState?.privateContent??{}),['bar'+variant]:{state,active}}})?.catch(()=>{});}
 function dirty(){const changed=JSON.stringify(state)!==JSON.stringify(applied);q('.apply-button').disabled=!changed;q('.undo-button').disabled=!changed;q('.save-status').textContent=changed?'Changes not applied':'No unsaved changes';}
 function syncControls(){
   const p=pose();q('.scale-input').value=p.z;
   q('.scale-value').textContent=p.z+'%';
   const movable=['outside','shelves','counter','seating'].includes(active);
   q('.placement-panel').hidden=!movable;
   canvas.style.cursor=movable?'grab':'default';canvas.style.touchAction=movable?'none':'pan-y';
   const originalFixed=poseKey()==='outside'&&state.outside==='original';
   q('.scale-control').querySelectorAll('input').forEach(control=>control.disabled=originalFixed);
   q('.position-note').textContent=originalFixed?'Original room view. Select another scenery to adjust its scale.':active==='outside'?'Only the scenery scales. Window frames and railings stay in place.':active==='counter'?'The tip jar stays on the countertop and scales with the counter and bartender.':active==='seating'?'Guests scale with their seats.':'Bottles scale with the shelves.';
   const min=poseKey()==='outside'?100:60;q('.scale-input').min=min;q('.scale-input').max=170;
   q('.room-title').textContent=room().label;q('.selected-caption').textContent=partLabel()+' · '+(active==='outside'?sceneryNames[state.outside]:room().label);dirty();
 }
 function addChoice(id,label,source,isFurniture=false){
   const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.setAttribute('aria-label','Select: '+label);button.setAttribute('aria-pressed',String(state[active]===id));
   if(source){const image=document.createElement('img');image.src=source;image.alt='';if(isFurniture)image.className='furniture-thumbnail';button.append(image);}
   const text=document.createElement('span');text.className='choice-title';text.textContent=label;button.append(text);
   button.onclick=()=>{state[active]=id;if(active==='room'){state.shelves=id;state.counter=id;state.seating=id;state.seatCount=Math.min(state.seatCount,room().layers.filter(layer=>layer.role==='seating').length);}renderCatalog();syncControls();draw();remember();};q('.catalog').append(button);
 }
 function rangeControl(label,key,min,max){const wrapper=document.createElement('label');const title=document.createElement('span');title.textContent=label;const output=document.createElement('output');output.textContent=state[key];title.append(output);const slider=document.createElement('input');slider.type='range';slider.min=min;slider.max=max;slider.value=state[key];slider.setAttribute('aria-label',label);slider.oninput=()=>{state[key]=Number(slider.value);output.textContent=state[key];syncControls();draw();remember();};wrapper.append(title,slider);q('.extra-controls').append(wrapper);}
 function renderCatalog(){
   q('.catalog').replaceChildren();q('.extra-controls').replaceChildren();q('.category-title').textContent=partLabel();
   q('.part-tabs').querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.category===active)));
   if(active==='outside'){addChoice('original','Original view',room().thumb);for(const item of data.backdrops)addChoice(item.id,sceneryNames[item.id],item.thumb);}
   else if(active==='room'){for(const item of data.rooms)addChoice(item.id,item.label,item.thumb);}
   else if(['shelves','counter','seating'].includes(active)){for(const item of data.rooms){const layer=item.layers.find(layer=>layer.role===active);addChoice(item.id,item.label,layer?.image,true);}if(active==='seating')rangeControl('Seat count','seatCount',0,room().layers.filter(layer=>layer.role==='seating').length);}
   else if(active==='bottles'){const names={'velvet-original':'Velvet · original','classic-cocktails':'Classic cocktails','luxury-whiskey':'Premium whiskey','wine-cellar':'Wine cellar','budget-mix':'Everyday spirits','fantasy-elixirs':'Fantasy elixirs','cyberpunk-liquids':'Neon drinks'};for(const preset of data.bottlePresets)addChoice(preset.id,names[preset.id]??preset.label,preset.thumb,true);}
   else {for(const [id,label] of [['amber','Warm'],['rose','Rose'],['blue','Blue'],['violet','Violet'],['emerald','Emerald'],['ice','Cool']])addChoice(id,label);rangeControl('Light intensity','strength',0,70);}
   const count=q('.catalog').children.length;q('.category-count').textContent=active==='outside'?'12 scenes + original':count+(count===3?' options':' options');
   if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}});
 }
 function cover(ctx,image,w,h,p={x:0,y:0,z:100}){const scale=Math.max(w/image.width,h/image.height)*p.z/100;const iw=image.width*scale,ih=image.height*scale;ctx.drawImage(image,(w-iw)/2+p.x/100*Math.max(0,(iw-w)/2),(h-ih)/2+p.y/100*Math.max(0,(ih-h)/2),iw,ih);}
 function bounds(layers){const rects=layers.map(layer=>layer.rect??{x:0,y:0,width:1,height:1});const x=Math.min(...rects.map(rect=>rect.x)),y=Math.min(...rects.map(rect=>rect.y));return {x,y,width:Math.max(...rects.map(rect=>rect.x+rect.width))-x,height:Math.max(...rects.map(rect=>rect.y+rect.height))-y};}
 async function draw(){
   const currentEpoch=++epoch,snapshot=clone(state),selectedRoom=room();const W=800,H=Math.round(W*selectedRoom.canvas.height/selectedRoom.canvas.width);
   const work=document.createElement('canvas');work.width=W;work.height=H;const ctx=work.getContext('2d');
   const exterior=snapshot.outside==='original'?selectedRoom.original:data.backdrops.find(item=>item.id===snapshot.outside)?.image;
   const outside=await img(exterior);if(outside){if(snapshot.outside==='original')ctx.drawImage(outside,0,0,W,H);else cover(ctx,outside,W,H,snapshot.poses.outside);}
   const architecture=await img(selectedRoom.layers.find(layer=>layer.role==='architecture').image);if(architecture)ctx.drawImage(architecture,0,0,W,H);
   for(const role of ['shelves','counter','seating']){
     const sourceRoom=data.rooms.find(item=>item.id===snapshot[role])??selectedRoom;const sourceLayers=sourceRoom.layers.filter(layer=>layer.role===role);const targets=selectedRoom.layers.filter(layer=>layer.role===role);
     if(!sourceLayers.length||!targets.length)continue;
     const targetBounds=bounds(targets),sourceBounds=bounds(sourceLayers);const p=snapshot.poses[role];
     ctx.save();ctx.translate((targetBounds.x+targetBounds.width/2)*W+p.x/100*W*.25,(targetBounds.y+targetBounds.height/2)*H+p.y/100*H*.25);ctx.scale(p.z/100,p.z/100);ctx.translate(-(targetBounds.x+targetBounds.width/2)*W,-(targetBounds.y+targetBounds.height/2)*H);
     if(role==='counter'){
       const actor=await img(data.bartender);if(actor){const height=H*.46,width=height*actor.width/actor.height;const surface=(targetBounds.y+targetBounds.height*sourceRoom.counterSurface.backY)*H;ctx.save();ctx.beginPath();ctx.rect(0,0,W,surface);ctx.clip();ctx.drawImage(actor,(targetBounds.x+targetBounds.width*.65)*W-width/2,surface-height*.62,width,height);ctx.restore();}
     }
     const layers=role==='seating'?targets.slice(0,snapshot.seatCount):sourceLayers;
     for(const layer of layers){const source=role==='seating'?sourceLayers[0]:layer;const image=await img(source.image);if(!image)continue;let r=layer.rect??{x:0,y:0,width:1,height:1};if(role!=='seating')r={x:targetBounds.x+(r.x-sourceBounds.x)/sourceBounds.width*targetBounds.width,y:targetBounds.y+(r.y-sourceBounds.y)/sourceBounds.height*targetBounds.height,width:r.width/sourceBounds.width*targetBounds.width,height:r.height/sourceBounds.height*targetBounds.height};ctx.save();if(layer.flipX){ctx.translate((r.x+r.width)*W,r.y*H);ctx.scale(-1,1);ctx.drawImage(image,0,0,r.width*W,r.height*H);}else ctx.drawImage(image,r.x*W,r.y*H,r.width*W,r.height*H);ctx.restore();}
     if(role==='shelves'){
       const preset=data.bottlePresets.find(preset=>preset.id===snapshot.bottles)??data.bottlePresets[0];
       const atlas=await img(preset.atlas?.image??data.atlas);
       if(atlas){
         const columns=preset.atlas?.columns??data.atlasColumns,rows=preset.atlas?.rows??data.atlasRows,cw=atlas.width/columns,ch=atlas.height/rows;
         ctx.filter=preset.filter??'none';
         for(const bay of sourceRoom.shelfDecor?.bays??[]){
           const native=bay.rect,r={x:targetBounds.x+(native.x-sourceBounds.x)/sourceBounds.width*targetBounds.width,y:targetBounds.y+(native.y-sourceBounds.y)/sourceBounds.height*targetBounds.height,width:native.width/sourceBounds.width*targetBounds.width,height:native.height/sourceBounds.height*targetBounds.height};
           for(let row=0;row<bay.rowBaselines.length;row++){
             const items=preset.items.filter(item=>item.row===row);
             const baseline=bay.rowBaselines[row],previous=row?bay.rowBaselines[row-1]:.07;
             const cap=(baseline-previous)*r.height*H*.76,spacing=r.width*W/(items.length+1);
             items.forEach((item,index)=>{
               const b=preset.cellBounds[item.cell],sw=b.width*cw,sh=b.height*ch;
               const height=Math.min(cap*(item.scale??1),spacing*.72*sh/sw),width=height*sw/sh;
               const x=r.x*W+spacing*(index+1)-width/2,y=(r.y+baseline*r.height)*H-height;
               ctx.drawImage(atlas,((item.cell%columns)+b.x)*cw,(Math.floor(item.cell/columns)+b.y)*ch,sw,sh,x,y,width,height);
             });
           }
         }
         ctx.filter='none';
       }
     }
     if(role==='counter'){const jar=await img(data.tipJar);if(jar){const anchor=sourceRoom.counterSurface,height=H*.075,width=height*jar.width/jar.height;const anchorX=(targetBounds.x+targetBounds.width*anchor.jarX)*W,anchorY=(targetBounds.y+targetBounds.height*anchor.jarY)*H;ctx.drawImage(jar,anchorX-width/2,anchorY-height,width,height);}}
     if(role==='seating')for(let index=0;index<Math.min(2,layers.length);index++){
       const guest=await img(data.guests[index]);if(!guest)continue;
       const r=layers[index].rect,seat=sourceRoom.seatSurface,anchor=data.guestAnchors[index];
       const height=H*anchor.height,width=height*guest.width/guest.height;
       const seatX=(r.x+r.width*seat.x)*W,seatY=(r.y+r.height*seat.y)*H;
       ctx.drawImage(guest,seatX-width*anchor.x,seatY-height*anchor.y,width,height);
       const chair=await img(sourceLayers[0].image);
       if(chair){
         const [top,bottom]=seat.frontBand;
         ctx.drawImage(chair,0,chair.height*top,chair.width,chair.height*(bottom-top),r.x*W,(r.y+r.height*top)*H,r.width*W,r.height*(bottom-top)*H);
       }
     }
     ctx.restore();
   }
   if(currentEpoch!==epoch)return;context.clearRect(0,0,canvas.width,canvas.height);cover(context,shade(work,snapshot.lighting,snapshot.strength),canvas.width,canvas.height);
 }
 let drag;
 canvas.onpointerdown=event=>{
   if(!state.poses[active]||(active==='outside'&&state.outside==='original'))return;
   drag={x:event.clientX,y:event.clientY,pose:clone(pose())};canvas.setPointerCapture(event.pointerId);
 };
 canvas.onpointermove=event=>{
   if(!drag)return;
   const rect=canvas.getBoundingClientRect();
   const p=pose();
   if(active==='outside'&&p.z===100)p.z=110;
   p.x=Math.max(-100,Math.min(100,Math.round(drag.pose.x+(event.clientX-drag.x)/rect.width*300)));
   p.y=Math.max(-100,Math.min(100,Math.round(drag.pose.y+(event.clientY-drag.y)/rect.height*300)));
   syncControls();draw();
 };
 canvas.onpointerup=canvas.onpointercancel=()=>{if(drag){drag=undefined;remember();}};
 q('.scale-input').oninput=event=>{if(active==='outside'&&state.outside==='original')return;pose().z=Number(event.target.value);syncControls();draw();remember();};
 q('.apply-button').onclick=()=>{applied=clone(state);dirty();q('.save-status').textContent='Design applied to preview';remember();};q('.undo-button').onclick=()=>{state=clone(applied);renderCatalog();syncControls();draw();remember();};
 window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent?.['bar'+variant];if(saved?.state?.poses){state={...initial(),...saved.state};normalizeScales();active=saved.active??active;renderCatalog();syncControls();draw();}});
 renderCatalog();syncControls();draw();
});
})();
