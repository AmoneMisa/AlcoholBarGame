name: alcohol-bar-game

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barlingo}
      POSTGRES_USER: ${POSTGRES_USER:-barlingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  app:
    image: ${APP_IMAGE:-alcohol-bar-game:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-barlingo}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-barlingo}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - backend

volumes:
  postgres_data:
    name: alcohol_bar_postgres_data

networks:
  backend:
    driver: bridge

